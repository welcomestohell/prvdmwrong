authors = ["Fire <znotfireman@gmail.com>"]
description = "Roots implementation for Prvd 'M Wrong"
includes = [
    "src/**/*.luau",
    "LICENSE.md",
    "README.md",
    "pesde.toml",
    "logger.luau",
    "dependencies.luau",
    "runtime.luau",
    "providers.luau",
    "lifecycles.luau",
]
license = "MPL-2.0"
name = "prvdmwrong/roots"
repository = "https://github.com/prvdmwrong/prvdmwrong"
version = "0.2.0-rc.4"

[indices]
default = "https://github.com/pesde-pkg/index"

[target]
build_files = [
    "src",
    "logger.luau",
    "dependencies.luau",
    "runtime.luau",
    "providers.luau",
    "lifecycles.luau",
]
environment = "roblox"
lib = "src/init.luau"
[dependencies]
logger = { workspace = "prvdmwrong/logger", version = "0.2.0-rc.4" }
dependencies = { workspace = "prvdmwrong/dependencies", version = "0.2.0-rc.4" }
providers = { workspace = "prvdmwrong/providers", version = "0.2.0-rc.4" }
lifecycles = { workspace = "prvdmwrong/lifecycles", version = "0.2.0-rc.4" }
runtime = { workspace = "prvdmwrong/runtime", version = "0.2.0-rc.4" }

		[scripts]
		roblox_sync_config_generator = ".pesde/scripts/roblox_sync_config_generator.luau"
		sourcemap_generator = ".pesde/scripts/sourcemap_generator.luau"
		
		[dev_dependencies]
		scripts = { name = "pesde/scripts_rojo", version = "^0.1.0", target = "lune" }
		rojo = { name = "pesde/rojo", version = "^7.4.4", target = "lune" }
	