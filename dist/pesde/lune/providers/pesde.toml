authors = ["Fire <znotfireman@gmail.com>"]
description = "Provider creation for Prvd 'M Wrong"
includes = [
    "src/**/*.luau",
    "LICENSE.md",
    "README.md",
    "pesde.toml",
    "runtime.luau",
    "logger.luau",
    "lifecycles.luau",
    "dependencies.luau",
    "runtime.luau",
    "logger.luau",
    "lifecycles.luau",
    "dependencies.luau",
]
license = "MPL-2.0"
name = "prvdmwrong/providers"
repository = "https://github.com/prvdmwrong/prvdmwrong"
version = "0.2.0-rc.4"

[indices]
default = "https://github.com/pesde-pkg/index"

[target]
build_files = [
    "src",
    "runtime.luau",
    "logger.luau",
    "lifecycles.luau",
    "dependencies.luau",
    "runtime.luau",
    "logger.luau",
    "lifecycles.luau",
    "dependencies.luau",
]
environment = "lune"
lib = "src/init.luau"
[dependencies]
dependencies = { name = "prvdmwrong/dependencies", version = "0.2.0-rc.4" }
runtime = { name = "prvdmwrong/runtime", version = "0.2.0-rc.4" }
lifecycles = { name = "prvdmwrong/lifecycles", version = "0.2.0-rc.4" }
logger = { name = "prvdmwrong/logger", version = "0.2.0-rc.4" }
