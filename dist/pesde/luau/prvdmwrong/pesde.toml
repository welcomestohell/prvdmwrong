authors = ["Fire <znotfireman@gmail.com>"]
description = "Entry point to Prvd 'M Wrong"
includes = [
    "src/**/*.luau",
    "LICENSE.md",
    "README.md",
    "pesde.toml",
    "dependencies.luau",
    "roots.luau",
    "lifecycles.luau",
    "providers.luau",
    "dependencies.luau",
    "roots.luau",
    "lifecycles.luau",
    "providers.luau",
    "dependencies.luau",
    "roots.luau",
    "lifecycles.luau",
    "providers.luau",
]
license = "MPL-2.0"
name = "prvdmwrong/prvdmwrong"
repository = "https://github.com/prvdmwrong/prvdmwrong"
version = "0.2.0-rc.3"

[indices]
default = "https://github.com/pesde-pkg/index"

[target]
build_files = [
    "src",
    "dependencies.luau",
    "roots.luau",
    "lifecycles.luau",
    "providers.luau",
    "dependencies.luau",
    "roots.luau",
    "lifecycles.luau",
    "providers.luau",
    "dependencies.luau",
    "roots.luau",
    "lifecycles.luau",
    "providers.luau",
]
environment = "luau"
lib = "src/init.luau"
[dependencies]
dependencies = { name = "prvdmwrong/dependencies", version = "0.2.0-rc.3" }
roots = { name = "prvdmwrong/roots", version = "0.2.0-rc.3" }
lifecycles = { name = "prvdmwrong/lifecycles", version = "0.2.0-rc.3" }
providers = { name = "prvdmwrong/providers", version = "0.2.0-rc.3" }
