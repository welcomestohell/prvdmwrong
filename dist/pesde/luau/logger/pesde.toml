authors = ["Fire <znotfireman@gmail.com>"]
description = "Logging for Prvd 'M Wrong"
includes = [
    "src/**/*.luau",
    "LICENSE.md",
    "README.md",
    "pesde.toml",
    "runtime.luau",
    "runtime.luau",
    "runtime.luau",
]
license = "MPL-2.0"
name = "prvdmwrong/logger"
repository = "https://github.com/prvdmwrong/prvdmwrong"
version = "0.2.0-rc.4"

[indices]
default = "https://github.com/pesde-pkg/index"

[target]
build_files = [
    "src",
    "runtime.luau",
    "runtime.luau",
    "runtime.luau",
]
environment = "luau"
lib = "src/init.luau"
[dependencies]
runtime = { name = "prvdmwrong/runtime", version = "0.2.0-rc.4" }
