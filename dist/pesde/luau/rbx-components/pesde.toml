authors = ["Fire <znotfireman@gmail.com>"]
description = "Component functionality for Prvd 'M Wrong"
includes = [
    "src/**/*.luau",
    "LICENSE.md",
    "README.md",
    "pesde.toml",
    "logger.luau",
    "roots.luau",
    "providers.luau",
    "dependencies.luau",
    "logger.luau",
    "roots.luau",
    "providers.luau",
    "dependencies.luau",
    "logger.luau",
    "roots.luau",
    "providers.luau",
    "dependencies.luau",
]
license = "MPL-2.0"
name = "prvdmwrong/rbx_components"
repository = "https://github.com/prvdmwrong/prvdmwrong"
version = "0.2.0-rc.4"

[indices]
default = "https://github.com/pesde-pkg/index"

[target]
build_files = [
    "src",
    "logger.luau",
    "roots.luau",
    "providers.luau",
    "dependencies.luau",
    "logger.luau",
    "roots.luau",
    "providers.luau",
    "dependencies.luau",
    "logger.luau",
    "roots.luau",
    "providers.luau",
    "dependencies.luau",
]
environment = "luau"
lib = "src/init.luau"
[dependencies]
logger = { workspace = "prvdmwrong/logger", version = "0.2.0-rc.4" }
roots = { workspace = "prvdmwrong/roots", version = "0.2.0-rc.4" }
providers = { workspace = "prvdmwrong/providers", version = "0.2.0-rc.4" }
dependencies = { workspace = "prvdmwrong/dependencies", version = "0.2.0-rc.4" }
