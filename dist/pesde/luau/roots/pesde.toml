authors = ["Fire <znotfireman@gmail.com>"]
description = "Roots implementation for Prvd 'M Wrong"
includes = [
    "src/**/*.luau",
    "LICENSE.md",
    "README.md",
    "pesde.toml",
    "logger.luau",
    "runtime.luau",
    "providers.luau",
    "lifecycles.luau",
    "logger.luau",
    "runtime.luau",
    "providers.luau",
    "lifecycles.luau",
    "logger.luau",
    "runtime.luau",
    "providers.luau",
    "lifecycles.luau",
]
license = "MPL-2.0"
name = "prvdmwrong/roots"
repository = "https://github.com/prvdmwrong/prvdmwrong"
version = "0.2.0-rc.3"

[indices]
default = "https://github.com/pesde-pkg/index"

[target]
build_files = [
    "src",
    "logger.luau",
    "runtime.luau",
    "providers.luau",
    "lifecycles.luau",
    "logger.luau",
    "runtime.luau",
    "providers.luau",
    "lifecycles.luau",
    "logger.luau",
    "runtime.luau",
    "providers.luau",
    "lifecycles.luau",
]
environment = "luau"
lib = "src/init.luau"
[dependencies]
logger = { name = "prvdmwrong/logger", version = "0.2.0-rc.3" }
providers = { name = "prvdmwrong/providers", version = "0.2.0-rc.3" }
lifecycles = { name = "prvdmwrong/lifecycles", version = "0.2.0-rc.3" }
runtime = { name = "prvdmwrong/runtime", version = "0.2.0-rc.3" }
