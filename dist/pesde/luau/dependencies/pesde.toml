authors = ["Fire <znotfireman@gmail.com>"]
description = "Dependency resolution logic for Prvd 'M Wrong"
includes = [
    "src/**/*.luau",
    "LICENSE.md",
    "README.md",
    "pesde.toml",
    "lifecycles.luau",
    "logger.luau",
    "lifecycles.luau",
    "logger.luau",
    "lifecycles.luau",
    "logger.luau",
]
license = "MPL-2.0"
name = "prvdmwrong/dependencies"
repository = "https://github.com/prvdmwrong/prvdmwrong"
version = "0.2.0-rc.4"

[indices]
default = "https://github.com/pesde-pkg/index"

[target]
build_files = [
    "src",
    "lifecycles.luau",
    "logger.luau",
    "lifecycles.luau",
    "logger.luau",
    "lifecycles.luau",
    "logger.luau",
]
environment = "luau"
lib = "src/init.luau"
[dependencies]
lifecycles = { name = "prvdmwrong/lifecycles", version = "0.2.0-rc.4" }
logger = { name = "prvdmwrong/logger", version = "0.2.0-rc.4" }
